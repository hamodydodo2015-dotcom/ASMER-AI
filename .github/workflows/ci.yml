name: ASMER AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check worker.js
          node --check public/app.js
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r services/python/requirements.txt
      - name: Check Python syntax
        run: python -m py_compile services/python/main.py
      - name: Compile C++ utility
        run: g++ -std=c++17 -O2 -Wall -Wextra -pedantic engine/cpp/utility_engine.cpp -o /tmp/asmer-utility
